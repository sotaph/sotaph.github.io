<div class="h3-wrapper">
  <h3>
    <span class="lang-ja">{{ include.ja_title }}</span>
    <span class="lang-en" style="display: none;">{{ include.en_title }}</span>
  </h3>
  
  <label class="switch-mini">
    <input type="checkbox" onchange="toggleLanguage(this)">
    <span class="slider-mini"></span>
    <span class="label-text-mini">JA/EN</span>
  </label>
</div>
